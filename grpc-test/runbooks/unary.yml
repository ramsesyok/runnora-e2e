desc: Unary RPC で蔵書を1冊取得する
labels:
  - grpc
  - unary
vars:
  request: json://../cases/unary/get-book-request.json
  expected: json://../cases/unary/get-book-expected.json
runners:
  greq:
    addr: 127.0.0.1:19090
    tls: false
    importPaths:
      - ../proto
    protos:
      - ../proto/library.proto
steps:
  get_book:
    desc: B0003のタイトル、ジャンル、在庫数を確認する
    greq:
      sample.library.v1.LibraryService/GetBook:
        message: "{{ vars.request }}"
    test: |
      current.res.status == vars.expected.status &&
      compare(current.res.message, vars.expected.message)
