name: Multipart

on:
  push:
    paths:
      - '.github/workflows/multipart*.yml'
      - 'multipart-test/**'
      - 'multipart-openapi-test/**'
      - 'api-test/fixtures/uploads/cover.png'
  pull_request:
    paths:
      - '.github/workflows/multipart*.yml'
      - 'multipart-test/**'
      - 'multipart-openapi-test/**'
      - 'api-test/fixtures/uploads/cover.png'
  workflow_dispatch:
    inputs:
      runnora-ref:
        description: runnora commit or ref with multipart() support
        required: true
        default: v0.5.0
        type: string

permissions:
  contents: read

jobs:
  multipart:
    uses: ./.github/workflows/multipart-reusable.yml
    with:
      e2e-ref: ${{ github.sha }}
      runnora-repository: ramsesyok/runnora
      # v0.5.0 implementation; manual runs can also test a newer ref.
      runnora-ref: ${{ inputs.runnora-ref || 'd0a4f256b4ed5f2748cdfa753915af240bc49be8' }}
