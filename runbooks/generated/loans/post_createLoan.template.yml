desc: 本を貸し出す template
labels:
  - generated
  - openapi
  - loans
  - method:post
  - operation:createLoan
  - mode:template

runners:
  req:
    endpoint: ${RUNNORA_BASE_URL}

vars:
  case: {}

steps:
  call_api:
    req:
      /loans:
        post:
          headers: "{{ vars.case.headers }}"
          body:
            application/json: "{{ vars.case.requestBody }}"
    test: |
      current.res.status == vars.case.expect.status
