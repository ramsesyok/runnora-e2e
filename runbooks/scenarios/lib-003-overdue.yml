desc: LIB-003 延滞中の会員は借りられず、返却すると借りられる
# 実行: runnora run --config config.yaml --before-sql sql/cases/lib003_overdue_before.sql <this>
# 前処理で「M0002 が B0004 を 21 日前に借りて未返却 (期限 7 日前)」の貸出 1 を作る
labels:
  - scenario
  - loans
  - plsql-setup
runners:
  req:
    endpoint: http://127.0.0.1:18081
    # 応答を OpenAPI 定義で自動検証する。異常系の入力を送るためリクエスト側の検証は行わない
    openapi3: ../../openapi/library-api.yaml
    skipValidateRequest: true
steps:
  member_overdue:
    desc: 前処理で作った延滞により、M0002が延滞ありと表示されることを確認する
    req:
      /members/M0002:
        get:
          body: null
    test: |
      current.res.status == 200 &&
      current.res.body.activeLoanCount == 1 &&
      current.res.body.overdue == true
  overdue_loan:
    desc: 貸出中一覧で、貸出1（B0004）の返却期限が本日より前であることを確認する
    req:
      /members/M0002/loans?status=ACTIVE:
        get:
          body: null
    test: |
      current.res.status == 200 &&
      current.res.body.total == 1 &&
      current.res.body.items[0].loanId == 1 &&
      current.res.body.items[0].bookId == "B0004" &&
      date(current.res.body.items[0].dueDate) < now()
  book_lent:
    desc: 前処理で在庫も減らしているため、B0004の貸出可能冊数が0であることを確認する
    req:
      /books/B0004:
        get:
          body: null
    test: |
      current.res.status == 200 &&
      current.res.body.availableCopies == 0
  loan_rejected:
    desc: 延滞中のM0002が別の本B0001を借りようとすると409 OVERDUE_LOANになる
    req:
      /loans:
        post:
          body:
            application/json:
              memberId: M0002
              bookId: B0001
    test: |
      current.res.status == 409 &&
      current.res.body.code == "OVERDUE_LOAN"
  return_overdue:
    desc: 延滞している貸出1を返却する
    req:
      /loans/1/return:
        post:
          body:
            application/json: {}
    test: |
      current.res.status == 200 &&
      current.res.body.status == "RETURNED"
  member_cleared:
    desc: 返却後は延滞なし・貸出0件になることを確認する
    req:
      /members/M0002:
        get:
          body: null
    test: |
      current.res.status == 200 &&
      current.res.body.activeLoanCount == 0 &&
      current.res.body.overdue == false
  loan_ok:
    desc: 延滞が解消したのでB0001を借りられる（貸出IDは2）
    req:
      /loans:
        post:
          body:
            application/json:
              memberId: M0002
              bookId: B0001
    test: |
      current.res.status == 201 &&
      current.res.body.loanId == 2
