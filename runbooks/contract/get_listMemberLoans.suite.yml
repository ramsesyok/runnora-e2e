desc: 契約 listMemberLoans 会員の貸出履歴を取得する（モック・実APIの両方で実行する）
labels:
  - contract
  - members
  - operation:listMemberLoans

vars:
  cases:
    - json://../../cases/contract/members/get_listMemberLoans/01_M0002.json
    - json://../../cases/contract/members/get_listMemberLoans/02_not_found.json

steps:
  run_case:
    desc: ケースJSONを順に読み込み、templateで呼び出して期待ステータスと本文の一部を検証する
    loop:
      count: len(vars.cases)
    include:
      path: ./get_listMemberLoans.template.yml
      vars:
        case: "{{ vars.cases[i] }}"
