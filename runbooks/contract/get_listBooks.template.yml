# runbooks/generated/ から複製して拡張した契約テスト用 template (生成物は再生成で上書きされるため)
# 変更点: ステータスに加え、expect.body のトップレベル項目が応答と一致すること (subset) を検証する
desc: 蔵書を検索する contract template
labels:
  - openapi
  - books
  - method:get
  - operation:listBooks
  - mode:template
  - contract

runners:
  req:
    endpoint: ${RUNNORA_BASE_URL}
    # モック・実 API どちらの応答も OpenAPI 定義で検証する (モックの定義ずれも検出できる)
    openapi3: ../../openapi/library-api.yaml
    skipValidateRequest: true

vars:
  case: {}

steps:
  call_api:
    req:
      /books?genre={{ vars.case.queryParams.genre }}&availableOnly={{ vars.case.queryParams.availableOnly }}:
        get:
          headers: "{{ vars.case.headers }}"
    test: |
      current.res.status == vars.case.expect.status &&
      all(keys(vars.case.expect.body), { current.res.body[#] == vars.case.expect.body[#] })
