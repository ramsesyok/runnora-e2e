desc: "稼働状態を確認する template"
labels:
  - generated
  - openapi
  - "system"
  - method:get
  - "operation:getHealth"
  - mode:template

runners:
  "req":
    endpoint: ${RUNNORA_BASE_URL}

vars:
  case: {}

steps:
  call_api:
    "req":
      "/health":
        get:
          headers: "{{ vars.case.headers }}"
    test: |
      current.res.status == vars.case.expect.status
