desc: 蔵書を登録する template
labels:
  - generated
  - openapi
  - books
  - method:post
  - operation:createBook
  - mode:template

runners:
  req:
    endpoint: ${RUNNORA_BASE_URL}

vars:
  case: {}

steps:
  call_api:
    req:
      /books:
        post:
          headers: "{{ vars.case.headers }}"
          body:
            application/json: "{{ vars.case.requestBody }}"
    test: |
      current.res.status == vars.case.expect.status
