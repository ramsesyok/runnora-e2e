desc: "本を返却する template"
labels:
  - generated
  - openapi
  - "loans"
  - method:post
  - "operation:returnLoan"
  - mode:template

runners:
  "req":
    endpoint: ${RUNNORA_BASE_URL}

vars:
  case: {}

steps:
  call_api:
    "req":
      "/loans/{{ vars.case.pathParams.loanId }}/return":
        post:
          headers: "{{ vars.case.headers }}"
          body:
            text/plain: ""
    test: |
      current.res.status == vars.case.expect.status
