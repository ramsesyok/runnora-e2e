desc: LIB-007 BULK COLLECT/FORALLで投入した大量の貸出履歴を照会する
# 実行: runnora run --config config.yaml --before-sql sql/cases/lib007_history_before.sql <this>
# 前処理で M0004 に B0005〜B0020 の返却済み貸出 16 件 (loan 1〜16) を投入する
labels:
  - scenario
  - members
  - plsql-setup
runners:
  req:
    endpoint: http://127.0.0.1:18081
    # 応答を OpenAPI 定義で自動検証する。異常系の入力を送るためリクエスト側の検証は行わない
    openapi3: ../../openapi/library-api.yaml
    skipValidateRequest: true
  db: oracle://libapp:libapp_pw@127.0.0.1:1522/FREEPDB1
steps:
  returned_history:
    desc: M0004の返却済み履歴が16件、貸出ID順に並んでいることを確認する
    req:
      /members/M0004/loans?status=RETURNED:
        get:
          headers:
            X-Test-Scenario: LIB-007
          body: null
    test: |
      current.res.status == 200 &&
      current.res.body.total == 16 &&
      current.res.body.items[0].loanId == 1 &&
      current.res.body.items[0].bookId == "B0005" &&
      current.res.body.items[15].loanId == 16 &&
      current.res.body.items[15].bookId == "B0020" &&
      all(current.res.body.items, .returnedAt != nil)
  no_active:
    desc: 貸出中の履歴は0件である
    req:
      /members/M0004/loans?status=ACTIVE:
        get:
          headers:
            X-Test-Scenario: LIB-007
          body: null
    test: |
      current.res.status == 200 &&
      current.res.body.total == 0
  member_clean:
    desc: 返却済みの貸出は期限を過ぎていても延滞にならない
    req:
      /members/M0004:
        get:
          headers:
            X-Test-Scenario: LIB-007
          body: null
    test: |
      current.res.status == 200 &&
      current.res.body.activeLoanCount == 0 &&
      current.res.body.overdue == false
  loan_after_history:
    desc: 履歴が多くても新規貸出でき、貸出IDは17になる
    req:
      /loans:
        post:
          headers:
            X-Test-Scenario: LIB-007
          body:
            application/json:
              memberId: M0004
              bookId: B0005
    test: |
      current.res.status == 201 &&
      current.res.body.loanId == 17
  db_batch_log:
    desc: 前処理がBULK COLLECT LIMIT 5で4バッチに分けて投入したことをログで確認する
    db:
      query: |
        SELECT message
          FROM test_hook_log
         WHERE hook_name = 'cases/lib007_history'
         ORDER BY log_id DESC
         FETCH FIRST 1 ROWS ONLY
    test: current.rows[0].MESSAGE == "batches=4, rows=16"
